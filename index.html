    let currentLesson = null;
    let currentQuestionIndex = 0;
    let score = 0;

    function loadLesson(lessonId) {
        currentLesson = databaseLezioni[lessonId];
        currentQuestionIndex = 0;
        score = 0;
        
        document.getElementById('main-menu').classList.add('hidden');
        document.getElementById('quiz-area').classList.remove('hidden');
        document.getElementById('lesson-title').innerText = currentLesson.title;
        
        showQuestion();
    }

    function showQuestion() {
        const container = document.getElementById('question-container');
        const nextBtn = document.getElementById('next-btn');
        nextBtn.classList.add('hidden');
        
        if (currentQuestionIndex >= currentLesson.questions.length) {
            container.innerHTML = `<h3>Quiz Completato!</h3><p>Hai risposto correttamente a ${score} su ${currentLesson.questions.length} domande.</p>`;
            return;
        }

        const qData = currentLesson.questions[currentQuestionIndex];
        let html = `<div class="question-card">
            <p><strong>Domanda ${currentQuestionIndex + 1} di ${currentLesson.questions.length}</strong></p>
            <p>${qData.q}</p>`;
            
        if (qData.image) {
            html += `<img src="${qData.image}" class="quiz-img" alt="Immagine domanda" onerror="this.style.display='none'">`;
        }
        
        html += `<div class="options">`;
        qData.options.forEach((opt, idx) => {
            html += `<label><input type="radio" name="option" value="${idx}"> ${opt}</label>`;
        });
        html += `</div>
            <button class="btn" onclick="checkAnswer()">Rispondi</button>
            <div id="feedback" class="feedback hidden"></div>
        </div>`;
        
        container.innerHTML = html;
    }

    function checkAnswer() {
        const selected = document.querySelector('input[name="option"]:checked');
        if (!selected) {
            alert("Seleziona una risposta prima di procedere!");
            return;
        }

        const userAnswer = parseInt(selected.value);
        const qData = currentLesson.questions[currentQuestionIndex];
        const feedbackDiv = document.getElementById('feedback');
        
        feedbackDiv.classList.add('hidden');
        if (userAnswer === qData.correct) {
            feedbackDiv.className = "feedback correct";
            feedbackDiv.innerHTML = `Risposta Corretta! ${qData.explanation}`;
            score++;
        } else {
            feedbackDiv.className = "feedback incorrect";
            feedbackDiv.innerHTML = `Risposta Errata. La risposta corretta era: "${qData.options[qData.correct]}".<br>${qData.explanation}`;
        }

        const radios = document.querySelectorAll('input[name="option"]');
        radios.forEach(r => r.disabled = true);

        document.getElementById('next-btn').classList.remove('hidden');
    }

    function nextQuestion() {
        currentQuestionIndex++;
        showQuestion();
    }

    function goHome() {
        document.getElementById('quiz-area').classList.add('hidden');
        document.getElementById('main-menu').classList.remove('hidden');
    }
